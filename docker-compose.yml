version: "3.9"

services:
  # ============================================================
  # Samba AD DC — домен-контроллер (Active Directory)
  # DNS + Kerberos + LDAP для Linux/Windows/macOS
  # ПОРТ 445 НЕ публикуется (его занимает файловый сервер) =>
  # ограничение: GPO/SYSVOL с Windows-клиентов недоступны (вход в домен и логин работают)
  # ============================================================
  service_samba_addc:
    restart: always
    container_name: service_samba_addc
    build:
      context: ./services/samba_addc
    hostname: ${AD_DC_HOSTNAME:-dc1}
    domainname: ${AD_REALM:-home.arpa}
    environment:
      - TZ=${TZ:-Europe/Moscow}
      - REALM=${AD_REALM:-HOME.ARPA}
      - DOMAIN=${AD_DOMAIN:-HOME}
      - HOSTNAME=${AD_DC_HOSTNAME:-dc1}
      - DNS_FORWARDER=${AD_DNS_FORWARDER:-1.1.1.1}
      - ADMIN_PASS=${AD_ADMIN_PASSWORD:?Set AD_ADMIN_PASSWORD in .env (see .env.example)}
    networks:
      network_service:
        ipv4_address: 172.28.0.53   # фиксированный IP внутри docker-сети (используется как DNS)
    volumes:
      - ./folders/samba_addc/etc:/etc/samba
      - ./folders/samba_addc/lib:/var/lib/samba
    tmpfs:
      - /run/samba
      - /var/cache/samba
    ports:
      - "53:53"        # DNS (tcp/udp)
      - "53:53/udp"
      - "88:88"        # Kerberos (tcp/udp)
      - "88:88/udp"
      - "135:135"      # RPC endpoint mapper
      - "389:389"      # LDAP (tcp/udp)
      - "389:389/udp"
      - "464:464"      # kpasswd (tcp/udp)
      - "464:464/udp"
      - "636:636"      # LDAPS
      - "3268:3268"    # Global Catalog
      - "3269:3269"    # Global Catalog over TLS
      - "49152:49152"  # фиксированный RPC-порт (см. run.sh: rpc server port)
    healthcheck:
      test: ["CMD-SHELL", "host -t SRV _ldap._tcp.$$REALM 127.0.0.1 | grep -q SRV"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 90s

  # ============================================================
  # Файловый сервер Samba — member домена AD
  # Шары: home_share (гость) + персональные каталоги доменных пользователей
  # ============================================================
  service_samba_folder:
    restart: always
    container_name: service_samba_folder
    build:
      context: ./services/samba_folder
    hostname: nas
    depends_on:
      service_samba_addc:
        condition: service_healthy
    environment:
      - TZ=${TZ:-Europe/Moscow}
      - REALM=${AD_REALM:-HOME.ARPA}
      - DOMAIN=${AD_DOMAIN:-HOME}
      - DC=service_samba_addc
      - JOIN_USER=${AD_JOIN_USER:-administrator}
      - JOIN_PASS=${AD_JOIN_PASSWORD:?Set AD_JOIN_PASSWORD in .env (see .env.example)}
    dns:
      - 172.28.0.53     # DNS = домен-контроллер (SRV-записи + форвардер наружу)
    extra_hosts:
      - "service_samba_addc:172.28.0.53"
    networks:
      network_service:
    volumes:
      - ./folders/users:/var/home-service/users
      - ./folders/share:/var/home-service/share
      - ./services/samba_folder/config:/etc/samba/smb.conf.d
    ports:
      - "445:445"

  # ============================================================
  # Media-стек: qBittorrent -> Radarr/Sonarr/Lidarr -> Jellyfin
  # Все media-сервисы без явных networks: сидят в default-сети compose
  # и видят друг друга по именам сервисов (напр. service_qbittorrent:8080).
  # Пути /downloads и /media ОДИНАКОВЫ во всех контейнерах —
  # это связь qBittorrent <-> *arr <-> Jellyfin без Remote Path Mapping.
  # ============================================================
  service_qbittorrent:        # торрент-клиент (BitTorrent)
    image: lscr.io/linuxserver/qbittorrent:latest
    container_name: service_qbittorrent
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=${TZ:-Europe/Moscow}
      - WEBUI_PORT=8080
    volumes:
      - ./folders/qbittorrent/config:/config
      - ./folders/qbittorrent/downloads:/downloads
    ports:
      - 8080:8080
      - 6881:6881
      - 6881:6881/udp
    restart: always

  service_radarr:             # фильмы: качает через qBittorrent, раскладывает в /media/movies
    image: lscr.io/linuxserver/radarr:latest
    container_name: service_radarr
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=${TZ:-Europe/Moscow}
    volumes:
      - ./folders/radarr/config:/config
      - ./folders/qbittorrent/downloads:/downloads
      - ./folders/media:/media
    ports:
      - 7878:7878
    restart: always

  service_sonarr:             # сериалы: /media/tv
    image: lscr.io/linuxserver/sonarr:latest
    container_name: service_sonarr
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=${TZ:-Europe/Moscow}
    volumes:
      - ./folders/sonarr/config:/config
      - ./folders/qbittorrent/downloads:/downloads
      - ./folders/media:/media
    ports:
      - 8989:8989
    restart: always

  service_lidarr:             # музыка: /media/music
    image: lscr.io/linuxserver/lidarr:latest
    container_name: service_lidarr
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=${TZ:-Europe/Moscow}
    volumes:
      - ./folders/lidarr/config:/config
      - ./folders/qbittorrent/downloads:/downloads
      - ./folders/media:/media
    ports:
      - 8686:8686
    restart: always

  service_jellyfin:           # медиасервер: библиотеки из /media (movies, tv, music)
    image: lscr.io/linuxserver/jellyfin:latest
    container_name: service_jellyfin
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=${TZ:-Europe/Moscow}
    volumes:
      - ./folders/jellyfin/config:/config
      - ./folders/media:/media
    #devices:
    #  - /dev/dri:/dev/dri    # раскомментируй для аппаратного транскодирования (Intel QuickSync)
    ports:
      - 8096:8096
    restart: always

  # ============================================================
  # Медиасервер
  # ============================================================
  service_plex:
    image: lscr.io/linuxserver/plex:latest
    container_name: service_plex
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=${TZ:-Europe/Moscow}
      - VERSION=docker
     # - PLEX_CLAIM=claim-xKEZduwSg8zXbvZ3JHsJ
    volumes:
      - ./folders/plex_media_server/library:/config
      - ./folders/plex_media_server/movies:/movies
      - ./folders/plex_media_server/tvseries:/tv
    restart: always
    ports:
      - 32400:32400

