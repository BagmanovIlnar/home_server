services:
  # ============================================================
  # Samba AD DC — домен-контроллер (Active Directory)
  # DNS + Kerberos + LDAP для Linux/Windows/macOS
  # ПОРТ 445 НЕ публикуется (его занимает файловый сервер) =>
  # ограничение: GPO/SYSVOL с Windows-клиентов недоступны (вход в домен и логин работают)
  # ============================================================
  service_samba_addc:
    restart: always
    container_name: service_samba_addc
    build:
      context: ./services/samba_addc
    hostname: ${AD_DC_HOSTNAME:-dc1}
    domainname: ${AD_REALM:-home.arpa}
    environment:
      - TZ=${TZ:-Europe/Moscow}
      - REALM=${AD_REALM:-HOME.ARPA}
      - DOMAIN=${AD_DOMAIN:-HOME}
      - HOSTNAME=${AD_DC_HOSTNAME:-dc1}
      - DNS_FORWARDER=${AD_DNS_FORWARDER:-1.1.1.1}
      - ADMIN_PASS=${AD_ADMIN_PASSWORD:?Set AD_ADMIN_PASSWORD in .env (see .env.example)}
    networks:
      network_service:
        ipv4_address: 172.28.0.53   # фиксированный IP внутри docker-сети (используется как DNS)
    volumes:
      - ./folders/samba_addc/etc:/etc/samba
      - ./folders/samba_addc/lib:/var/lib/samba
    tmpfs:
      - /run/samba
      - /var/cache/samba
    ports:
      - "53:53"        # DNS (tcp/udp)
      - "53:53/udp"
      - "88:88"        # Kerberos (tcp/udp)
      - "88:88/udp"
      - "135:135"      # RPC endpoint mapper
      - "389:389"      # LDAP (tcp/udp)
      - "389:389/udp"
      - "464:464"      # kpasswd (tcp/udp)
      - "464:464/udp"
      - "636:636"      # LDAPS
      - "3268:3268"    # Global Catalog
      - "3269:3269"    # Global Catalog over TLS
      - "49152:49152"  # фиксированный RPC-порт (см. run.sh: rpc server port)
    healthcheck:
      test: ["CMD-SHELL", "host -t SRV _ldap._tcp.$$REALM 127.0.0.1 | grep -q SRV"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 90s

  # ============================================================
  # Файловый сервер Samba — member домена AD
  # Шары: home_share (гость) + персональные каталоги доменных пользователей
  # ============================================================
  service_samba_folder:
    restart: always
    container_name: service_samba_folder
    build:
      context: ./services/samba_folder
    hostname: nas
    depends_on:
      service_samba_addc:
        condition: service_healthy
    environment:
      - TZ=${TZ:-Europe/Moscow}
      - REALM=${AD_REALM:-HOME.ARPA}
      - DOMAIN=${AD_DOMAIN:-HOME}
      - DC=service_samba_addc
      - JOIN_USER=${AD_JOIN_USER:-administrator}
      - JOIN_PASS=${AD_JOIN_PASSWORD:?Set AD_JOIN_PASSWORD in .env (see .env.example)}
    dns:
      - 172.28.0.53     # DNS = домен-контроллер (SRV-записи + форвардер наружу)
    extra_hosts:
      - "service_samba_addc:172.28.0.53"
    networks:
      network_service:
    volumes:
      - ./folders/users:/var/home-service/users
      - ./folders/share:/var/home-service/share
      - ./services/samba_folder/config:/etc/samba/smb.conf.d
    ports:
      - "445:445"

  # ============================================================
  # Media-стек: qBittorrent -> Radarr/Sonarr/Lidarr -> Jellyfin
  # Все media-сервисы без явных networks: сидят в default-сети compose
  # и видят друг друга по именам сервисов (напр. service_qbittorrent:8080).
  # Пути /downloads и /media ОДИНАКОВЫ во всех контейнерах —
  # это связь qBittorrent <-> *arr <-> Jellyfin без Remote Path Mapping.
  # ============================================================
  service_qbittorrent:        # торрент-клиент (BitTorrent)
    image: lscr.io/linuxserver/qbittorrent:latest
    container_name: service_qbittorrent
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=${TZ:-Europe/Moscow}
      - WEBUI_PORT=8080
    volumes:
      - ./folders/qbittorrent/config:/config
      - ./folders/qbittorrent/downloads:/downloads
    ports:
      - 8080:8080
      - 6881:6881
      - 6881:6881/udp
    restart: always

  service_radarr:             # фильмы: качает через qBittorrent, раскладывает в /media/movies
    image: lscr.io/linuxserver/radarr:latest
    container_name: service_radarr
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=${TZ:-Europe/Moscow}
    volumes:
      - ./folders/radarr/config:/config
      - ./folders/qbittorrent/downloads:/downloads
      - ./folders/media:/media
    ports:
      - 7878:7878
    restart: always

  service_sonarr:             # сериалы: /media/tv
    image: lscr.io/linuxserver/sonarr:latest
    container_name: service_sonarr
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=${TZ:-Europe/Moscow}
    volumes:
      - ./folders/sonarr/config:/config
      - ./folders/qbittorrent/downloads:/downloads
      - ./folders/media:/media
    ports:
      - 8989:8989
    restart: always

  service_lidarr:             # музыка: /media/music
    image: lscr.io/linuxserver/lidarr:latest
    container_name: service_lidarr
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=${TZ:-Europe/Moscow}
    volumes:
      - ./folders/lidarr/config:/config
      - ./folders/qbittorrent/downloads:/downloads
      - ./folders/media:/media
    ports:
      - 8686:8686
    restart: always

  service_bazarr:              # субтитры: тянет для библиотек Radarr/Sonarr (API настраивается в UI)
    image: lscr.io/linuxserver/bazarr:latest
    container_name: service_bazarr
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=${TZ:-Europe/Moscow}
    volumes:
      - ./folders/bazarr/config:/config
      - ./folders/media:/media
    ports:
      - 6767:6767
    restart: always

  service_jellyfin:           # медиасервер: библиотеки из /media (movies, tv, music)
    image: lscr.io/linuxserver/jellyfin:latest
    container_name: service_jellyfin
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=${TZ:-Europe/Moscow}
    volumes:
      - ./folders/jellyfin/config:/config
      - ./folders/media:/media
    #devices:
    #  - /dev/dri:/dev/dri    # раскомментируй для аппаратного транскодирования (Intel QuickSync)
    ports:
      - 8096:8096
    restart: always

  # ============================================================
  # Telegram MTProto-прокси (WebSocket) — доступ к Telegram из LAN
  # Сборка из git-репозитория (пин тега). Ссылка для клиентов — в логах:
  #   docker compose logs service_tg_ws_proxy | grep 'tg://proxy'
  # Секрет: если TG_WS_PROXY_SECRET не задан в .env — генерируется заново
  # при каждом пересоздании контейнера (придётся заново брать из логов)
  # ============================================================
  service_tg_ws_proxy:
    restart: always
    container_name: service_tg_ws_proxy
    build:
      context: https://github.com/FlowSeal/tg-ws-proxy.git#v1.11.4
    environment:
      - TZ=${TZ:-Europe/Moscow}
      - TG_WS_PROXY_SECRET=${TG_WS_PROXY_SECRET:-}
    ports:
      - 1443:1443

  # ============================================================
  # Docker Registry — хранилище собственных образов
  # ponytail: вместо Harbor (10+ контейнеров + БД + сертификаты) — один registry:2;
  # если понадобятся UI/сканирование/репликация — ставить Harbor отдельным проектом
  # Без аутентификации — как и прежний Transmission, только доверенная LAN
  # ============================================================
  service_registry:
    image: registry:2
    container_name: service_registry
    environment:
      - TZ=${TZ:-Europe/Moscow}
    volumes:
      - ./folders/registry:/var/lib/registry
    ports:
      - 5000:5000
    restart: always

  # ============================================================
  # Vaultwarden — хранение паролей (Bitwarden-совместимый сервер)
  # Клиенты (desktop/mobile/расширение браузера) работают по HTTP из LAN;
  # web-vault требует HTTPS (см. README). После регистрации всех —
  # SIGNUPS_ALLOWED=false в .env. База (sqlite) — folders/vaultwarden/config
  # ============================================================
  service_vaultwarden:
    image: vaultwarden/server:latest
    container_name: service_vaultwarden
    environment:
      - TZ=${TZ:-Europe/Moscow}
      - SIGNUPS_ALLOWED=${SIGNUPS_ALLOWED:-true}
      - ADMIN_TOKEN=${ADMIN_TOKEN:-}   # пусто = админ-панель /admin отключена
    volumes:
      - ./folders/vaultwarden/config:/data
    ports:
      - 8222:80
    restart: always

  # ============================================================
  # MeTube — web-UI для yt-dlp: качай видео с YouTube и 100+ сайтов
  # Загрузки сразу в общую медиатеку /media/youtube (Jellyfin/Plex)
  # ============================================================
  service_metube:
    image: alexta69/metube:latest
    container_name: service_metube
    environment:
      - TZ=${TZ:-Europe/Moscow}
     # - USER=ilnar          # включить basic-auth (пары USER+PASS)
     # - PASS=Str0ng_Pass!
    volumes:
      - ./folders/media/youtube:/downloads   # общая медиатека media-стека
    ports:
      - 8081:8081
    restart: always

  # ============================================================
  # SearXNG — приватный метапоисковик (без трекинга)
  # settings.yml создаётся автоматически при первом старте
  # ============================================================
  service_searxng:
    image: searxng/searxng:latest
    container_name: service_searxng
    environment:
      - TZ=${TZ:-Europe/Moscow}
      - SEARXNG_BASE_URL=${SEARXNG_BASE_URL:-http://localhost:8888/}
    volumes:
      - ./folders/searxng:/etc/searxng
    ports:
      - 8888:8080
    restart: always

  # ============================================================
  # Portainer — web-UI управления Docker (контейнеры, образы, тома,
  # логи, консоли). Первый вход: создать admin-аккаунт (10 мин на это)
  # ============================================================
  service_portainer:
    image: portainer/portainer-ce:latest
    container_name: service_portainer
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./folders/portainer:/data
    ports:
      - 9443:9443     # web-UI (https, самоподписанный сертификат)
    restart: always

  # ============================================================
  # Медиасервер
  # ============================================================
  service_plex:
    image: lscr.io/linuxserver/plex:latest
    container_name: service_plex
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=${TZ:-Europe/Moscow}
      - VERSION=docker
     # - PLEX_CLAIM=claim-xKEZduwSg8zXbvZ3JHsJ
    volumes:
      - ./folders/plex_media_server/library:/config
      - ./folders/plex_media_server/movies:/movies
      - ./folders/plex_media_server/tvseries:/tv
      - ./folders/media:/media   # медиатека media-стека (*arr → Jellyfin/Plex)
    restart: always
    ports:
      - 32400:32400

  # ============================================================
  # Ace Stream Engine 3.2.11 — p2p-стриминг (сборка из базового
  # ubuntu:22.04 + официальный тарбл движка, см. services/acestream/)
  # HTTP API + встроенный web-плеер: http://<IP>:6878/webui/player/
  # Кэш/конфиг в folders/acestream
  # ============================================================
  service_acestream:
    restart: always
    container_name: service_acestream
    build:
      context: ./services/acestream
    environment:
      - TZ=${TZ:-Europe/Moscow}
    volumes:
      - ./folders/acestream:/root/.AceStream
    ports:
      - 6878:6878
    healthcheck:
      test: ["CMD-SHELL", "curl -fs 'http://127.0.0.1:6878/webui/api/service?method=get_version' || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # ============================================================
  # Ace Stream Proxy — прокси над движком (сборка из github):
  # шаринг сессий движка между устройствами, HLS/TS-раздача,
  # транскод для браузера, REST API + Swagger (:8085/swagger-ui)
  # Плейлист: по умолчанию файл folders/acestream/playlist.m3u
  # (кладём на хосте), либо ACESTREAM_PLAYLIST_URL=http(s)://... в .env
  # ============================================================
  service_acestream_proxy:
    restart: always
    container_name: service_acestream_proxy
    build:
      context: https://github.com/BagmanovIlnar/acestream-proxy.git
    depends_on:
      - service_acestream
    environment:
      - TZ=${TZ:-Europe/Moscow}
      - ACESTREAM_URI=service_acestream
      - ACESTREAM_PLAYLIST_URL=${ACESTREAM_PLAYLIST_URL:-file:///data/playlist.m3u}
    volumes:
      - ./folders/acestream:/data:ro   # плейлист: folders/acestream/playlist.m3u
    ports:
      - 8085:8080

  # ============================================================
  # Ace Stream Web UI — веб-интерфейс к прокси (сборка из github,
  # nginx): список каналов/стримов, плеер в браузере.
  # API и потоки проксирует на service_acestream_proxy (same-origin)
  # ============================================================
  service_acestream_web:
    restart: always
    container_name: service_acestream_web
    build:
      context: https://github.com/BagmanovIlnar/acestream-proxy-web-ui.git
    depends_on:
      - service_acestream_proxy
    environment:
      - PROXY_URL=http://service_acestream_proxy:8080
    ports:
      - 8086:80

  #service_ftp:
  #  restart: always
  #  container_name: service_ftp1
  #  build:
  #    context: ./services/ftp
  #  networks:
  #    network_service:
  #  volumes:
  #    - ./folders/share:/var/home-service/share
  #    - ./folders/users:/var/home-service/users
  #  ports:
  #    - 20:20
  #    - 21:21
    #  - "22:22"
    #  - "990:990"
  #    - 4559-4559:4559-4559

networks:
  network_service:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/24
          gateway: 172.28.0.1
